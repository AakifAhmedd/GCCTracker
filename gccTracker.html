<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GCC Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12241E;
  --ink-soft:#3E544C;
  --emerald:#0E6B4F;
  --emerald-deep:#0A4A38;
  --emerald-pale:#E4F1EB;
  --cranberry:#C2185B;
  --cranberry-pale:#FBE6EE;
  --gold:#B8872F;
  --gold-pale:#F7EEDC;
  --paper:#F3F6F4;
  --card:#FFFFFF;
  --line:#DDE6E1;
  --amber:#C77F0A;
  --amber-pale:#FBEED9;
  --red:#B7402C;
  --red-pale:#FAE4DF;
  --ok:#1F7A46;
  --ok-pale:#E1F2E7;
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --radius:14px;
  --shadow: 0 1px 2px rgba(18,36,30,0.04), 0 6px 20px rgba(18,36,30,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--emerald-pale);}
a{color:var(--emerald-deep);}

/* ---------- Layout shell ---------- */
.app{max-width:1180px;margin:0 auto;padding:0 24px 80px;}

header.top{
  background:linear-gradient(160deg, var(--emerald-deep), var(--emerald) 70%);
  color:#fff;
  padding:28px 0 0;
  margin-bottom:0;
}
.top-inner{max-width:1180px;margin:0 auto;padding:0 24px;}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:14px;}
.brand-mark{
  width:46px;height:46px;border-radius:50%;
  background:rgba(255,255,255,0.14);
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid rgba(255,255,255,0.4);
  font-family:var(--font-display);font-weight:700;font-size:18px;
  flex-shrink:0;
}
.brand h1{
  font-family:var(--font-display);
  font-weight:600;
  font-size:22px;
  margin:0;
  letter-spacing:0.2px;
}
.brand p{margin:2px 0 0;font-size:12.5px;color:rgba(255,255,255,0.75);font-family:var(--font-mono);letter-spacing:0.03em;}

.iobtns{display:flex;gap:8px;flex-wrap:wrap;}
.iobtns button{
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.35);
  color:#fff;
  padding:8px 14px;
  border-radius:9px;
  font-family:var(--font-body);
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  transition:background .15s ease;
}
.iobtns button:hover{background:rgba(255,255,255,0.22);}
.iobtns input[type=file]{display:none;}

/* club tabs */
.club-tabs{display:flex;gap:6px;margin-top:22px;flex-wrap:wrap;}
.club-tab{
  padding:11px 18px;
  border-radius:11px 11px 0 0;
  background:rgba(255,255,255,0.08);
  color:rgba(255,255,255,0.8);
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  border:1px solid transparent;
  border-bottom:none;
  transition:all .15s ease;
  display:flex;align-items:center;gap:8px;
}
.club-tab .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.5;}
.club-tab.active{background:var(--paper);color:var(--ink);}
.club-tab.active .dot{background:var(--cranberry);opacity:1;}
.club-tab:not(.active):hover{background:rgba(255,255,255,0.16);color:#fff;}

/* section nav */
nav.sectionnav{
  background:var(--card);
  border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;
  box-shadow:0 1px 0 rgba(18,36,30,0.02);
}
.sectionnav-inner{max-width:1180px;margin:0 auto;padding:0 24px;display:flex;gap:4px;overflow-x:auto;}
.sec-btn{
  border:none;background:none;padding:14px 14px 12px;
  font-family:var(--font-body);font-weight:600;font-size:13.5px;
  color:var(--ink-soft);cursor:pointer;white-space:nowrap;
  border-bottom:2.5px solid transparent;
}
.sec-btn.active{color:var(--emerald-deep);border-bottom-color:var(--cranberry);}
.sec-btn:hover{color:var(--emerald-deep);}

main{padding-top:28px;}
.view{display:none;}
.view.active{display:block;}

/* ---------- Generic cards ---------- */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:22px 24px;
  box-shadow:var(--shadow);
}
.card + .card{margin-top:18px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
@media (max-width:820px){.grid2,.grid3{grid-template-columns:1fr;}}

h2.section-title{
  font-family:var(--font-display);
  font-size:22px;font-weight:600;
  margin:0 0 4px;
}
p.section-sub{margin:0 0 20px;color:var(--ink-soft);font-size:13.5px;}

/* ---------- Dashboard ---------- */
.score-hero{
  display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:stretch;
}
@media (max-width:900px){.score-hero{grid-template-columns:1fr;}}
.score-big{
  font-family:var(--font-display);
  font-size:64px;font-weight:700;line-height:1;
  color:var(--emerald-deep);
}
.score-big span{font-size:24px;color:var(--ink-soft);font-weight:500;font-family:var(--font-body);}
.tier-badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:7px 14px;border-radius:999px;font-weight:700;font-size:13px;
  letter-spacing:0.03em;text-transform:uppercase;
  margin-top:10px;
}
.tier-Platinum{background:#EAEAF2;color:#4A4A6A;}
.tier-Gold{background:var(--gold-pale);color:var(--gold);}
.tier-Silver{background:#EFF1F1;color:#697370;}
.tier-Bronze{background:#F3E4D6;color:#8C5A2B;}
.tier-None{background:var(--red-pale);color:var(--red);}

.subscore-row{display:flex;gap:22px;margin-top:18px;flex-wrap:wrap;}
.subscore{flex:1;min-width:120px;}
.subscore .label{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.04em;font-weight:600;}
.subscore .val{font-family:var(--font-mono);font-size:20px;font-weight:500;margin-top:2px;}
.bar{height:7px;border-radius:5px;background:var(--line);margin-top:6px;overflow:hidden;}
.bar > i{display:block;height:100%;background:var(--emerald);border-radius:5px;}

/* tier ladder (signature element) */
.ladder-wrap{display:flex;justify-content:center;align-items:center;}
.ladder-note{font-size:11.5px;color:var(--ink-soft);text-align:center;margin-top:8px;font-family:var(--font-mono);}

.note-callout{
  background:var(--emerald-pale);border:1px solid #CFE6DA;border-radius:10px;
  padding:12px 14px;font-size:12.5px;color:var(--emerald-deep);margin-top:16px;
}
.note-callout.warn{background:var(--amber-pale);border-color:#EEDBAF;color:#7A520A;}

/* ---------- Checklist items ---------- */
.category-block{margin-bottom:22px;}
.category-block:last-child{margin-bottom:0;}
.category-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;
}
.category-head h3{font-size:15px;margin:0;font-weight:700;}
.category-head .cat-progress{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);}

.item{
  display:flex;gap:12px;align-items:flex-start;
  padding:11px 4px;border-top:1px solid var(--line);
}
.item:first-child{border-top:none;}
.item input[type=checkbox]{
  width:19px;height:19px;margin-top:2px;flex-shrink:0;accent-color:var(--emerald);cursor:pointer;
}
.item-body{flex:1;min-width:0;}
.item-text{font-size:13.8px;}
.item-text.done{color:var(--ink-soft);}
.item-meta{display:flex;gap:8px;align-items:center;margin-top:5px;flex-wrap:wrap;}
.badge{
  font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;
  padding:2.5px 8px;border-radius:999px;
}
.badge-done{background:var(--ok-pale);color:var(--ok);}
.badge-overdue{background:var(--red-pale);color:var(--red);}
.badge-soon{background:var(--amber-pale);color:var(--amber);}
.badge-pending{background:#EEF1EF;color:var(--ink-soft);}
.deadline-tag{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);}
.item textarea.note-input{
  width:100%;margin-top:7px;padding:7px 9px;font-family:var(--font-body);font-size:12.5px;
  border:1px solid var(--line);border-radius:7px;resize:vertical;min-height:32px;background:#FBFCFB;
}
.item textarea.note-input:focus{outline:2px solid var(--emerald-pale);border-color:var(--emerald);}

/* ---------- Avenues ---------- */
.avenue-card{margin-bottom:16px;}
.avenue-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
.avenue-head h3{margin:0;font-size:16px;font-family:var(--font-display);font-weight:600;}
.avenue-theme{font-size:13px;color:var(--ink-soft);margin:6px 0 12px;}
.avenue-stats{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-top:4px;}
.avenue-count{font-family:var(--font-mono);font-size:26px;font-weight:500;color:var(--emerald-deep);}
.avenue-count small{font-size:13px;color:var(--ink-soft);font-family:var(--font-body);}
.subcheck{display:flex;gap:10px;align-items:flex-start;margin-top:6px;font-size:13px;}
.subcheck input{margin-top:3px;accent-color:var(--cranberry);cursor:pointer;}
.theme-select{margin-top:8px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;font-family:var(--font-body);font-size:13px;background:#FBFCFB;}

/* ---------- Optional ---------- */
.optional-progress-banner{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  background:var(--cranberry-pale);border:1px solid #F1C3D6;border-radius:10px;padding:14px 18px;margin-bottom:18px;
}
.optional-progress-banner .num{font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--cranberry);}

/* ---------- Projects log ---------- */
table.proj-table{width:100%;border-collapse:collapse;font-size:13px;}
table.proj-table th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);
  padding:8px 10px;border-bottom:2px solid var(--line);font-weight:700;
}
table.proj-table td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;}
table.proj-table tr:last-child td{border-bottom:none;}
.proj-form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px;}
.proj-form .full{grid-column:1/-1;}
@media (max-width:700px){.proj-form{grid-template-columns:1fr;}}
.proj-form label{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-soft);margin-bottom:4px;}
.proj-form input, .proj-form select, .proj-form textarea{
  width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-family:var(--font-body);font-size:13.5px;background:#FBFCFB;
}
.proj-form textarea{min-height:44px;resize:vertical;}
.btn-primary{
  background:var(--emerald-deep);color:#fff;border:none;padding:10px 20px;border-radius:9px;
  font-weight:600;font-size:13.5px;cursor:pointer;font-family:var(--font-body);
}
.btn-primary:hover{background:var(--emerald);}
.btn-ghost{background:none;border:1px solid var(--line);padding:9px 16px;border-radius:9px;font-size:13px;cursor:pointer;color:var(--ink-soft);font-weight:600;}
.btn-ghost:hover{border-color:var(--cranberry);color:var(--cranberry);}
.btn-del{background:none;border:none;color:var(--red);cursor:pointer;font-size:12px;font-weight:700;}
.rmis-tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;text-transform:uppercase;}
.rmis-Submitted{background:var(--ok-pale);color:var(--ok);}
.rmis-Pending{background:var(--amber-pale);color:var(--amber);}
.evidence-link{font-size:12px;color:var(--emerald-deep);word-break:break-all;}

/* ---------- Overview / comparison ---------- */
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media (max-width:820px){.compare-grid{grid-template-columns:1fr;}}
.compare-card h3{font-family:var(--font-display);font-size:19px;margin:0 0 2px;}
.compare-card .sub{font-size:12px;color:var(--ink-soft);font-family:var(--font-mono);}
.compare-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;}
.compare-row:first-of-type{border-top:none;}
.missing-list{margin:10px 0 0;padding-left:0;list-style:none;}
.missing-list li{font-size:12.5px;padding:5px 0;border-top:1px solid var(--line);color:var(--ink-soft);}
.missing-list li:first-child{border-top:none;}
.missing-list li b{color:var(--ink);}

footer.appfoot{text-align:center;color:var(--ink-soft);font-size:11.5px;padding:36px 0 10px;font-family:var(--font-mono);}

.empty{color:var(--ink-soft);font-size:13px;padding:18px 0;text-align:center;}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand-row">
      <div class="brand">
        <div>
          <h1>Guide Club Tracker</h1>
          <p>RI YEAR 2026–27 · SRI LANKA &amp; MALDIVES</p>
        </div>
      </div>
      <div class="iobtns">
        <button id="btnExport">Export data (JSON)</button>
        <button id="btnImportTrigger">Import data (JSON)</button>
        <input type="file" id="fileImport" accept="application/json">
        <button id="btnReset">Reset all data</button>
      </div>
    </div>
    <div class="club-tabs" id="clubTabs"></div>
  </div>
</header>

<nav class="sectionnav">
  <div class="sectionnav-inner" id="sectionNav"></div>
</nav>

<div class="app">
  <main id="mainArea"></main>

</div>

const STORAGE_KEY = 'gayathiri_tracker_v1';

function freshClubState(){
  return {
    category:'community',
    mandatory:{},      // itemId -> bool
    mandatoryNotes:{},  // itemId -> string
    avenues:{},         // avenueId -> { theme:bool, sub:[bool,...], choice:'' }
    optional:{},        // itemId -> bool
    projects:[]          // { id, title, avenue, focus, date, rmis, evidence }
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.clubs) {
        if(!parsed.clubs.colomboFort) parsed.clubs.colomboFort = freshClubState();
        if(!parsed.clubs.colomboWest) parsed.clubs.colomboWest = freshClubState();
        return parsed;
      }
    }
  }catch(e){ console.warn('Could not parse saved state, starting fresh.', e); }
  return { clubs:{ colomboFort:freshClubState(), colomboWest:freshClubState() } };
}

let state = loadState();
let currentClub = 'colomboFort';
let currentSection = 'dashboard';

function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

/* ============================================================
   SCORING
   ============================================================ */
function allMandatoryItems(){
  let all = [];
  MANDATORY_CATEGORIES.forEach(cat => cat.items.forEach(it => all.push(it)));
  return all;
}

function mandatoryScore(club){
  const items = allMandatoryItems();
  const totalCount = items.length + AVENUES.length;
  const per = 170 / totalCount;
  let achieved = 0;
  items.forEach(it => { if(club.mandatory[it.id]) achieved++; });
  AVENUES.forEach(av => { if(avenueMinMet(club, av)) achieved++; });
  return { achieved: achieved*per, max:170, count: achieved, totalCount };
}

function avenueProjectCount(club, avenueId){
  return club.projects.filter(p => p.avenue === avenueId).length;
}

function avenueThemeSatisfied(club, av){
  const a = club.avenues[av.id] || {};
  if(av.subChecks){
    return a.sub && av.subChecks.every((_,i)=>a.sub[i]);
  }
  return !!a.theme;
}

function avenueMinMet(club, av){
  return avenueProjectCount(club, av.id) >= av.min && avenueThemeSatisfied(club, av);
}

function avenueCitationScore(club){
  // 70 pts total across 7 avenues = 10 pts each; awarded for exceeding the minimum, once minimum+theme is met
  let total = 0;
  AVENUES.forEach(av=>{
    if(!avenueMinMet(club, av)){ return; }
    const extra = Math.max(0, avenueProjectCount(club, av.id) - av.min);
    total += Math.min(10, extra * 5); // each extra project = 5 pts, capped at 10 (2 extra projects)
  });
  return { achieved: total, max:70 };
}

function optionalScore(club){
  let count = 0;
  OPTIONAL_ITEMS.forEach(it=>{ if(club.optional[it.id]) count++; });
  return { achieved: count*3, max:60, count, required:8 };
}

function totalScore(club){
  const m = mandatoryScore(club);
  const a = avenueCitationScore(club);
  const o = optionalScore(club);
  const sum = m.achieved + a.achieved + o.achieved;
  return { sum, m, a, o };
}

function tierFor(club){
  const t = totalScore(club);
  if(t.o.count < 8) return 'None';
  for(const tier of TIERS){
    if(t.sum >= tier.min && tier.name !== 'None') return tier.name;
  }
  return 'None';
}

/* ============================================================
   DATE / BADGE HELPERS
   ============================================================ */
function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
}

function statusBadge(done, deadline){
  if(done) return '<span class="badge badge-done">Completed</span>';
  if(deadline){
    const today = new Date(); today.setHours(0,0,0,0);
    const dl = new Date(deadline+'T00:00:00');
    const diffDays = Math.round((dl-today)/86400000);
    if(diffDays < 0) return '<span class="badge badge-overdue">Overdue</span>';
    if(diffDays <= 14) return '<span class="badge badge-soon">Due soon</span>';
  }
  return '<span class="badge badge-pending">Pending</span>';
}

function renderShell(){
  const tabsEl = document.getElementById('clubTabs');
  tabsEl.innerHTML = Object.keys(CLUB_META).map(id => `

    </div>`;

  tabsEl.querySelectorAll('.club-tab').forEach(el=>{
    el.addEventListener('click', ()=>{

      else if(currentSection === 'overview') currentSection = 'dashboard';
      renderAll();

  const navEl = document.getElementById('sectionNav');
  const visibleSections = currentClub === '__overview__' ? SECTIONS.filter(s=>s.id==='overview') : SECTIONS.filter(s=>s.id!=='overview');
  navEl.innerHTML = visibleSections.map(s=>`
    <button class="sec-btn ${s.id===currentSection?'active':''}" data-sec="${s.id}">${s.label}</button>

  navEl.querySelectorAll('.sec-btn').forEach(el=>{
    el.addEventListener('click', ()=>{ currentSection = el.dataset.sec; renderAll(); });
  });
}

function renderTierLadder(club){
  const t = totalScore(club);
  const score = Math.min(300, t.sum);
  const maxH = 260, w = 210;
  const bands = [
    {name:'Platinum', from:250, to:300, color:'#4A4A6A'},
    {name:'Gold', from:230, to:250, color:'#B8872F'},
    {name:'Silver', from:200, to:230, color:'#8A9490'},
    {name:'Bronze', from:175, to:200, color:'#B07A3E'},
    {name:'Below', from:0, to:175, color:'#D8DEDA'}
  ];
  let bandsHtml = '';
  bands.forEach(b=>{
    const y1 = maxH - (b.to/300)*maxH;
    const h = ((b.to-b.from)/300)*maxH;
    bandsHtml += `<rect x="70" y="${y1}" width="46" height="${h}" fill="${b.color}" opacity="0.85"/>`;
  });
  const markerY = maxH - (score/300)*maxH;
  const labels = [175,200,230,250,300];
  let labelsHtml = labels.map(v=>{
    const y = maxH - (v/300)*maxH;
    return `<line x1="66" y1="${y}" x2="70" y2="${y}" stroke="#7C8B84" stroke-width="1.5"/>
      <text x="60" y="${y+4}" font-size="10" text-anchor="end" fill="#5C6D66" font-family="JetBrains Mono, monospace">${v}</text>`;
  }).join('');

  return `
  <svg viewBox="0 0 210 285" width="210" height="300" role="img" aria-label="Citation tier ladder">
    ${bandsHtml}
    ${labelsHtml}
    <line x1="70" y1="${markerY}" x2="150" y2="${markerY}" stroke="#C2185B" stroke-width="2.5"/>
    <circle cx="150" cy="${markerY}" r="5" fill="#C2185B"/>
    <text x="156" y="${markerY+4}" font-size="12" font-weight="700" fill="#C2185B" font-family="JetBrains Mono, monospace">${Math.round(score)}</text>
    <text x="93" y="${maxH+22}" font-size="11" text-anchor="middle" fill="#3E544C" font-family="Inter, sans-serif">points</text>
  </svg>`;
}

    <p class="section-sub">Side-by-side progress for both clubs.</p>
    <div class="grid3">
      <div><div class="label" style="font-size:12px;color:var(--ink-soft);text-transform:uppercase;font-weight:700;">Colombo Fort score</div><div class="score-big" style="font-size:36px;">${Math.round(tFort.sum)}</div></div>
      <div><div class="label" style="font-size:12px;color:var(--ink-soft);text-transform:uppercase;font-weight:700;">Colombo West score</div><div class="score-big" style="font-size:36px;">${Math.round(tWest.sum)}</div></div>
      <div><div class="label" style="font-size:12px;color:var(--ink-soft);text-transform:uppercase;font-weight:700;">Gap</div><div class="score-big" style="font-size:36px;">${Math.abs(Math.round(tFort.sum-tWest.sum))}</div></div>
    </div>
  </div>
  <div class="compare-grid">
    ${clubCard('colomboFort', fort, tFort)}
    ${clubCard('colomboWest', west, tWest)}
  </div>`;
  return html;
}

/* ============================================================
   MAIN RENDER + EVENT WIRING
   ============================================================ */
function renderAll(){
  renderShell();
  const main = document.getElementById('mainArea');
  if(currentClub === '__overview__'){
    main.innerHTML = renderOverview();
    return;
  }
  let html = '';
switch (currentSection) {

    case 'dashboard':
        try {
            html = renderDashboard(currentClub);
        } catch (e) {
            throw new Error(`renderDashboard failed: ${e.message}`);
        }
        break;

    case 'mandatory':
        try {
            html = renderMandatory(currentClub);
        } catch (e) {
            throw new Error(`renderMandatory failed: ${e.message}`);
        }
        break;

    case 'avenues':
        try {
            html = renderAvenues(currentClub);
        } catch (e) {
            throw new Error(`renderAvenues failed: ${e.message}`);
        }
        break;

    case 'optional':
        try {
            html = renderOptional(currentClub);
        } catch (e) {
            throw new Error(`renderOptional failed: ${e.message}`);
        }
        break;

    case 'projects':
        try {
            html = renderProjects(currentClub);
        } catch (e) {
            throw new Error(`renderProjects failed: ${e.message}`);
        }
        break;

    default:
        try {
            html = renderDashboard(currentClub);
        } catch (e) {
            throw new Error(`Default renderDashboard failed: ${e.message}`);
        }
        break;
      }
  main.innerHTML = html;
  wireSectionEvents();
}

function wireSectionEvents(){
  const club = state.clubs[currentClub];
  if(!club) return;

  // mandatory checkboxes
  document.querySelectorAll('[data-mand]').forEach(el=>{
    el.addEventListener('change', ()=>{
      club.mandatory[el.dataset.mand] = el.checked;
      saveState(); renderAll();
    });
  });
  // mandatory notes
  document.querySelectorAll('[data-note]').forEach(el=>{
    el.addEventListener('input', ()=>{
      club.mandatoryNotes[el.dataset.note] = el.value;
      saveState();
    });
  });
  // category select
  const catSel = document.getElementById('categorySelect');
  if(catSel){
    catSel.addEventListener('change', ()=>{
      club.category = catSel.value; saveState(); renderAll();
    });
  }
  // optional checkboxes
  document.querySelectorAll('[data-opt]').forEach(el=>{
    el.addEventListener('change', ()=>{
      club.optional[el.dataset.opt] = el.checked;
      saveState(); renderAll();
    });
  });
  // avenue theme select
  document.querySelectorAll('[data-avtheme]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const id = el.dataset.avtheme;
      club.avenues[id] = club.avenues[id] || {};
      club.avenues[id].choice = el.value;
      club.avenues[id].theme = !!el.value;
      saveState(); renderAll();
    });
  });
  // avenue theme checkbox (simple)
  document.querySelectorAll('[data-avthemecheck]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const id = el.dataset.avthemecheck;
      club.avenues[id] = club.avenues[id] || {};
      club.avenues[id].theme = el.checked;
      saveState(); renderAll();
    });
  });
  // avenue sub-checks
  document.querySelectorAll('[data-avsub]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const [id, idx] = el.dataset.avsub.split(':');
      club.avenues[id] = club.avenues[id] || {};
      club.avenues[id].sub = club.avenues[id].sub || [];
      club.avenues[id].sub[idx] = el.checked;
      saveState(); renderAll();
    });
  });
  // project add
  const addBtn = document.getElementById('pf-add');
  if(addBtn){
    addBtn.addEventListener('click', ()=>{
      const title = document.getElementById('pf-title').value.trim();
      if(!title){ alert('Please enter a project title.'); return; }
      const proj = {
        id: 'p'+Date.now(),
        title,
        avenue: document.getElementById('pf-avenue').value,
        focus: document.getElementById('pf-focus').value.trim(),
        date: document.getElementById('pf-date').value,
        rmis: document.getElementById('pf-rmis').value,
        evidence: document.getElementById('pf-evidence').value.trim(),
        notes: document.getElementById('pf-notes').value.trim()
      };
      club.projects.push(proj);
      saveState(); renderAll();
    });
  }
  // project delete
  document.querySelectorAll('[data-delproj]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(!confirm('Remove this project entry?')) return;
      club.projects = club.projects.filter(p=>p.id !== el.dataset.delproj);
      saveState(); renderAll();
    });
  });
}

/* ============================================================
   EXPORT / IMPORT / RESET
   ============================================================ */
document.getElementById('btnExport').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${STORAGE_KEY+new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

document.getElementById('btnImportTrigger').addEventListener('click', ()=>{
  document.getElementById('fileImport').click();
});

document.getElementById('fileImport').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const imported = JSON.parse(ev.target.result);
      if(!imported.clubs) throw new Error('Invalid file format.');
      state = imported;
      saveState();
      renderAll();
      alert('Data imported successfully.');
    }catch(err){
      alert('Could not import this file: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

document.getElementById('btnReset').addEventListener('click', ()=>{
  if(!confirm('This will permanently erase all tracked data for both clubs on this device. Continue?')) return;
  state = { clubs:{ colomboFort:freshClubState(), colomboWest:freshClubState() } };
  saveState();
  renderAll();
});

/* ============================================================
   INIT
   ============================================================ */
try {
    renderAll();
} catch (e) {
    console.error(e);

    document.body.innerHTML = `
        <h2>Application failed to load</h2>
        <p>${e.message}</p>
        <pre>${e.stack}</pre>
    `;

    alert(
        "The application could not start.\n\n" +
        e.message
    );
}</script>
</body>
</html>
